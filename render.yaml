# One-click deploy: https://render.com → New → Blueprint → point at this repo.
services:
  - type: web
    name: propora
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PRODUCTION
        value: "true"
      - key: SEED_ON_START
        value: "true"          # loads the demo dataset on first boot
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: propora-db
          property: connectionString
      # APP_BASE_URL is derived from RENDER_EXTERNAL_URL automatically.
      # Optional SMTP — leave unset to disable outbound email.
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: propora-db
    plan: free
    databaseName: propora
